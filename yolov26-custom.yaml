scales:
  n: [0.33, 0.25, 1024]
nc: 3
names: ['Dust', 'Non Defective', 'Snow']
backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0
  - [-1, 1, SPDConv, [128]]      # 1
  - [-1, 3, C3k2, [128, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]    # 3
  - [-1, 6, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, LSKBlock, [256]]     # 5
  - [-1, 1, Conv, [512, 3, 2]]    # 6
  - [-1, 6, C3k2, [512, True]]    # 7
  - [-1, 1, SPPF, [512, 5]]       # 8
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 9
  - [[-1, 5], 1, Concat, [1]]  # 10
  - [-1, 3, C3k2, [256, False]] # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [[-1, 2], 1, Concat, [1]]  # 13
  - [-1, 3, C3k2, [128, False]] # 14 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]  # 15
  - [[-1, 11], 1, Concat, [1]]  # 16
  - [-1, 3, C3k2, [256, False]] # 17 (P4/16)

  - [-1, 1, Conv, [256, 3, 2]]  # 18
  - [[-1, 8], 1, Concat, [1]]   # 19
  - [-1, 3, C3k2, [512, True, 0.5]] # 20 (P5/32, 分辨率 20x20)
  # --- 关键：BRA 放在最深层，显存开销极小 ---
  - [-1, 1, BRA, [512]]         # 21
  # 最终检测头：输出 P3, P4, P5
  - [[14, 17, 21], 1, Detect, [nc]]